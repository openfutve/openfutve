# Publish container images to GHCR on merge to main.
#
# Tagged by commit SHA so a deployment can name exactly what it runs, plus a
# moving `main` tag for convenience. No `latest`: it is the tag people deploy by
# accident and then cannot reproduce.
#
# Pull requests build but do not push — a fork must never be able to publish
# under our namespace.

name: Publish images

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  poller:
    name: pollers image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/pollers/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/pollers:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/pollers:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker build -f apps/pollers/Dockerfile -t pollers:test .
          # The point of this image: the workspace dependency must resolve at
          # runtime, not just at build time.
          docker run --rm --entrypoint node pollers:test -e \
            "import('@openfutve/shared').then(m => { \
               const got = m.resolveTeamName('Dep. Tachira'); \
               if (got !== 'Deportivo Táchira FC') { \
                 console.error('workspace dependency did not resolve:', got); process.exit(1); \
               } \
               console.log('ok: @openfutve/shared resolves inside the image'); \
             })"
