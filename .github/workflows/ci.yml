# CI skeleton (Phase 0). Yuyo owns hardening this in Phase 1:
# per-app Docker image builds, and the replay-based integration test in Phase 2.
#
# Runners: GitHub-hosted, decided 2026-07-25 (issue #10).
#   - Free and unmetered for public repositories, so the usual reason to
#     self-host (minutes) does not apply to us.
#   - A self-hosted runner on the homelab would execute code from forked pull
#     requests on a machine that also hosts the deployment. That is the standard
#     way self-hosted runners get abused, and guarding it properly costs more
#     attention than the minutes are worth at our scale.
#   - Revisit only if build times become the bottleneck; the Turborepo remote
#     cache (ADR 0001) is the cheaper lever to pull first.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  migrations:
    name: migrations apply and roll back
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openfutve
          POSTGRES_PASSWORD: openfutve
          POSTGRES_DB: openfutve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openfutve"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openfutve:openfutve@localhost:5432/openfutve?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate
      - name: Apply migrations
        run: dbmate --migrations-dir packages/db/db/migrations up
      - name: Load seeds
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/db/seeds/001_sources.sql
      # Rule 2 in packages/db/README.md: every down migration must actually work.
      - name: Roll back
        run: dbmate --migrations-dir packages/db/db/migrations down

  integration:
    name: integration (fixtures, no live sources)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openfutve
          POSTGRES_PASSWORD: openfutve
          POSTGRES_DB: openfutve
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U openfutve"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openfutve:openfutve@localhost:5432/openfutve?sslmode=disable
      POLLER_LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate
      - run: dbmate --migrations-dir packages/db/db/migrations up
      # raw_payloads.source is a FK to sources, so the registry has to exist —
      # the same reason compose has a seed service between migrate and poller.
      - name: Load seeds
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/db/db/seeds/001_sources.sql
      # Through turbo, not `pnpm --filter ... test` directly: the latter skips
      # the task graph, so @openfutve/shared never gets built and the parser
      # tests fail on an unresolvable import.
      #
      # These exercise Fetcher -> raw-store against a real Postgres, replaying a
      # committed fixture from a local server. CI never fetches from a real
      # source: only deployed instances do that. See AGENTS.md.
      - run: pnpm exec turbo run test --filter=@openfutve/pollers

  compose:
    name: compose stack comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: docker compose up
        run: docker compose -f infra/compose/docker-compose.yml up --build --exit-code-from poller poller
      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
