# openFutVE — local dev / self-host stack, v0 (Phase 0).
#
# v0 is deliberately small: Postgres + migrations + one placeholder poller.
# Redpanda and Flink arrive in Phase 2; the API and web app in Phase 1.
#
#   cp .env.example .env
#   docker compose -f infra/compose/docker-compose.yml up

name: openfutve

services:
  # Refuses to start the stack if the database is exposed beyond loopback while
  # still using the placeholder password from .env.example — that password is
  # published in this repository, so the combination is never intentional.
  # Nothing else here can enforce it: a host firewall does not filter published
  # Docker ports, and a comment in a file is not a control.
  preflight:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfutve}
      POSTGRES_BIND: ${POSTGRES_BIND:-127.0.0.1}
    command:
      - sh
      - -ec
      - |
        case "$$POSTGRES_BIND" in
          127.0.0.1|localhost|::1|'[::1]') exit 0 ;;
        esac
        if [ "$$POSTGRES_PASSWORD" = "openfutve" ]; then
          echo ''
          echo 'REFUSING TO START'
          echo ''
          echo "  POSTGRES_BIND is $$POSTGRES_BIND, so the database is reachable"
          echo '  beyond this machine — but POSTGRES_PASSWORD is still the'
          echo '  placeholder published in .env.example, which everyone knows.'
          echo ''
          echo '  Set a real POSTGRES_PASSWORD in .env, or set'
          echo '  POSTGRES_BIND=127.0.0.1 to keep the database local.'
          echo ''
          echo '  Do not rely on ufw/firewalld here: Docker publishes ports via'
          echo '  its own DNAT rules and bypasses them.'
          echo ''
          exit 1
        fi
        echo "preflight ok — bind $$POSTGRES_BIND with a non-default password"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openfutve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openfutve}
      POSTGRES_DB: ${POSTGRES_DB:-openfutve}
    # Loopback by default; the preflight service enforces the pairing of a
    # wider bind with a real password.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfutve} -d ${POSTGRES_DB:-openfutve}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies packages/db migrations, then exits. Everything else waits for it.
  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openfutve}:${POSTGRES_PASSWORD:-openfutve}@postgres:5432/${POSTGRES_DB:-openfutve}?sslmode=disable
    volumes:
      - ../../packages/db/db:/db:ro
    command: ["--wait", "up"]

  # Loads packages/db/db/seeds/*.sql, then exits. Safe to re-run: the seeds
  # are written with ON CONFLICT ... DO UPDATE.
  seed:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openfutve}:${POSTGRES_PASSWORD:-openfutve}@postgres:5432/${POSTGRES_DB:-openfutve}?sslmode=disable
    volumes:
      - ../../packages/db/db/seeds:/seeds:ro
    command: >
      sh -c 'for f in /seeds/*.sql; do
               echo "seeding $$f";
               psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$$f" || exit 1;
             done'

  poller:
    build:
      context: ../..
      dockerfile: apps/pollers/Dockerfile
    # The placeholder runs once and exits; a restart policy here would just
    # loop it. Phase 1 turns this into a long-running scheduler.
    restart: "no"
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-openfutve}:${POSTGRES_PASSWORD:-openfutve}@postgres:5432/${POSTGRES_DB:-openfutve}?sslmode=disable
      POLLER_USER_AGENT: ${POLLER_USER_AGENT:-openfutve-bot/0.1 (+https://github.com/openfutve/openfutve)}
      POLLER_LOG_LEVEL: ${POLLER_LOG_LEVEL:-info}
      THESPORTSDB_API_KEY: ${THESPORTSDB_API_KEY:-123}
      THESPORTSDB_LEAGUE_ID: ${THESPORTSDB_LEAGUE_ID:-4513}

volumes:
  postgres-data:
